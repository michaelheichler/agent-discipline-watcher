name: Pylint

on: [push, pull_request]

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up the declared floor
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest
    - name: Checking shell syntax
      run: |
        bash -n $(git ls-files '*.sh')
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py') | tee pylint.log
        grep -q "rated at 10.00/10" pylint.log
    - name: Running the hook test suite
      run: |
        git config --global user.email "ci@agent-discipline-watcher.test"
        git config --global user.name "Agent Discipline Watcher CI"
        git config --global init.defaultBranch main
        cd hooks && python -m pytest . lib -q

  forward:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ahead: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up a version ahead of the floor
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.ahead }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: Running the hook test suite
      run: |
        git config --global user.email "ci@agent-discipline-watcher.test"
        git config --global user.name "Agent Discipline Watcher CI"
        git config --global init.defaultBranch main
        cd hooks && python -m pytest . lib -q

  bun:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
    - name: Installing the packages the extension imports at runtime
      run: |
        cd pi && bun install
    - name: Running the extension test suite
      run: |
        cd pi && bun test
