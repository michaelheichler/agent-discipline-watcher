name: Pylint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up the declared floor
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest pyyaml
    - name: Checking shell syntax
      run: |
        set -e
        for script in $(git ls-files '*.sh') bin/adw bin/adw-judge bin/adw-nuke bin/adw-config; do bash -n "$script"; done
    - name: Analysing the code with pylint
      run: |
        set -o pipefail
        pylint $(git ls-files '*.py') | tee pylint.log
        grep -q "rated at 10.00/10" pylint.log
    - name: Running the hook test suite
      run: |
        git config --global user.email "ci@agent-discipline-watcher.test"
        git config --global user.name "Agent Discipline Watcher CI"
        git config --global init.defaultBranch main
        (cd hooks && python -m pytest . lib -q)
        python3 -m pytest pi/test_merge_settings.py -q
    - name: Validate eval cases and scoring
      run: |
        python3 scripts/run_evals.py validate
        python3 -m pytest scripts/test_run_evals.py -q

  forward:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ahead: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up a version ahead of the floor
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.ahead }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyyaml
    - name: Running the hook test suite
      run: |
        git config --global user.email "ci@agent-discipline-watcher.test"
        git config --global user.name "Agent Discipline Watcher CI"
        git config --global init.defaultBranch main
        (cd hooks && python -m pytest . lib -q)
        python3 -m pytest pi/test_merge_settings.py -q

  plugin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "22"
    - name: Install the plugin validator
      run: npm install --global @anthropic-ai/claude-code
    - name: Validate plugin metadata
      run: claude plugin validate .

  bun:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: oven-sh/setup-bun@v2
    - name: Installing the packages the extension imports at runtime
      run: |
        cd pi && bun install
    - name: Typecheck the extension
      run: |
        cd pi && bun run typecheck
    - name: Running the extension test suite
      run: |
        cd pi && bun test
