name: Pylint

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest
    - name: Checking shell syntax
      run: |
        bash -n install.sh hooks/run.sh
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
    - name: Running the hook test suite
      run: |
        git config --global user.email "ci@agent-discipline-watcher.test"
        git config --global user.name "Agent Discipline Watcher CI"
        git config --global init.defaultBranch main
        cd hooks && python -m pytest . lib -q
